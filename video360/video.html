<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360° Video Player</title>
  <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container viewer-container">
    <a href="index.html" class="back-link">← Back to Home</a>
    <h1>360° Video Player</h1>
    <div class="projection-controls" style="display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:0 0 12px 0;">
      <label for="projection-mode" style="color:rgba(255,255,255,0.85);font-size:14px;">Projection</label>
      <select id="projection-mode" style="background:#1d1d1d;color:#fff;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:8px 10px;">
        <option value="360" selected>360 (Mono)</option>
        <option value="360_LR">360 (Side-by-side)</option>
        <option value="360_TB">360 (Top/Bottom)</option>
        <option value="180">180</option>
        <option value="180_LR">180 (Side-by-side)</option>
        <option value="180_MONO">180 (Mono)</option>
        <option value="NONE">None (normal video)</option>
      </select>
    </div>
    <button id="enable-motion-btn" style="display:none;margin-bottom:12px;">Enable Motion Controls</button>
    <div id="orientation-debug" style="position:fixed;bottom:10px;right:10px;background:rgba(0,0,0,0.7);color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;z-index:2000;display:none;"></div>
    <video id="my-360video" class="video-js vjs-default-skin" controls preload="auto" playsinline webkit-playsinline>
      <source src="studio.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>
  <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
  <script src="https://unpkg.com/videojs-vr/dist/videojs-vr.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
